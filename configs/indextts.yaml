# IndexTTS-1.5 (perceiver-conditioned; token_axis=1). cond-ID config: a gentle
# redirect preserves retain identity through IndexTTS's dual identity path (GPT
# conditioning + BigVGAN's own speaker encoder).
model: indextts
token_axis: 1
unlearn:
  alpha: 0.65
  gamma: 0.35
  redirect_w: 3.2
  structure_w: 2.0
  retain_w: 5.0
  k: 6
  steps: 40
  lr: 0.0005
eval:
  n_forget: 4
  n_retain_seen: 3
  n_retain_unseen: 1
  sentences: 2
  seed: 0
  n_splits: 5
relearn:
  steps: 40
  n: 3
  n_clips: 2
  max_seconds: 600
  budgets: "20:1,40:2,80:2,160:4"
  surfaces: [gpt_full, condpath_full]

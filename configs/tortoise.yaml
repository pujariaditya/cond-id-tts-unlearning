# Tortoise-TTS (autoregressive). cond-ID champion config.
model: tortoise
token_axis: -1
unlearn:
  alpha: 1.0
  gamma: 0.35
  redirect_w: 3.0
  structure_w: 0.5
  retain_w: 0.75
  k: 6
  steps: 25
  lr: 5.0e-4
eval:
  n_forget: 4
  n_retain_seen: 3
  n_retain_unseen: 1
  sentences: 2
  seed: 0
  n_splits: 5
relearn:
  steps: 40
  n: 3
  n_clips: 2
  max_seconds: 600
  budgets: "20:1,40:2,80:2,160:4"
  surfaces: [gpt_full, condpath_full]
